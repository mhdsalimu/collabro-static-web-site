<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <title>CollaBro</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link href="css/tooplate-barista.css" rel="stylesheet">

    <link href="css/whatsapp.css" rel="stylesheet">

    <style>
        body { 
            background-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), rgba(188, 108, 37, 1)), url('../images/slide5.jpg');
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
        }
        .thankyou-box {
  background-image: linear-gradient(to bottom, white, rgba(188, 108, 37, 1));
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="thankyou-box">
        <h1>Thank You!</h1>
        <p>Your message has been sent successfully.<br>
        We will get back to you soon.</p>
        <a href="index.html" class="custom-btn">Back to Home</a>
    </div>

    <!-- Add this modal at the end of your <body> in index.html -->
    <div class="modal fade" id="thankYouModal" tabindex="-1" aria-labelledby="thankYouModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="thankYouModalLabel">Thank You!</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            Your message has been sent successfully.<br>
            We will get back to you soon.
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <!-- Floating WhatsApp button (opens chat in new tab) -->
    <a href="https://wa.me/9778214173" class="whatsapp-float" target="_blank" rel="noopener noreferrer" data-tooltip="Chat with us on WhatsApp" aria-label="Chat on WhatsApp">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path fill="#ffffff" d="M20.52 3.48A11.9 11.9 0 0012 .5C6.21.5 1.5 5.21 1.5 11c0 1.95.5 3.86 1.45 5.53L.5 23.5l6.21-2.03A11.91 11.91 0 0012 22.5c5.79 0 10.5-4.71 10.5-10.5 0-3.02-1.18-5.83-3.98-8.52zM12 20.5c-1.37 0-2.7-.36-3.86-1.04l-.28-.16-3.68 1.2 1.24-3.45-.18-.3A8.4 8.4 0 013.5 11c0-4.68 3.82-8.5 8.5-8.5 2.27 0 4.4.88 6.01 2.48A8.43 8.43 0 0120.5 11C20.5 16.02 16.02 20.5 12 20.5z"/>
        <path fill="#ffffff" d="M17.06 14.14c-.28-.14-1.65-.82-1.9-.92-.25-.1-.43-.14-.61.14-.18.28-.7.92-.86 1.11-.16.18-.32.21-.59.07-.27-.14-1.14-.42-2.17-1.34-.8-.72-1.34-1.61-1.5-1.88-.16-.27-.02-.42.12-.56.12-.12.27-.32.41-.48.14-.16.18-.28.27-.46.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.02-.22-.53-.45-.46-.62-.47l-.53-.01c-.18 0-.46.07-.7.33-.24.26-.92.9-.92 2.2 0 1.3.94 2.56 1.07 2.74.13.18 1.84 2.98 4.46 4.18 1.62.7 2.35.83 3.18.67.51-.09 1.65-.67 1.88-1.32.23-.66.23-1.22.16-1.33-.07-.11-.25-.16-.53-.3z"/>
      </svg>
    </a>
    <script>
        $("#submit-form").submit((e)=>{
            e.preventDefault()
            $.ajax({
                url:"https://script.google.com/macros/s/AKfycbyriVqGFuuYtSdv-sS05Aacyer63cBmTq1HHhMgb-YVXoq1Gn5MgWmGHvod8zTFSwSKmA/exec",
                data:$("#submit-form").serialize(),
                method:"post",
                success:function (response){
                    var thankYouModal = new bootstrap.Modal(document.getElementById('thankYouModal'));
                    thankYouModal.show();
                    $("#submit-form")[0].reset();
                },
                error:function (err){
                    alert("Something Error")
                }
            })
        })
    </script>
</body>
</html>
